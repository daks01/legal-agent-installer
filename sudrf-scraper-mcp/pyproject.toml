[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sudrf-scraper-mcp"
version = "0.1.0"
description = "MCP-обёртка над SUDRF Scraper — сбор дел судов общей юрисдикции РФ (sudrf.ru) для legal-agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "legal-agent-installer" }]
keywords = ["mcp", "legal", "sudrf", "court", "russian-law"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=3.2,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
sudrf-scraper-mcp = "sudrf_scraper_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sudrf_scraper_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["E501"]
