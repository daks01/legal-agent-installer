[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laws-mcp"
version = "0.1.0"
description = "MCP-сервер локальной базы российского права (law7-lite, SQLite, без Docker)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "legal-agent-installer" }]
keywords = ["mcp", "legal", "russian-law", "law7", "sqlite"]
dependencies = [
    "fastmcp>=3.2,<4",
]

[project.scripts]
laws-mcp = "laws_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laws_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["E501"]
